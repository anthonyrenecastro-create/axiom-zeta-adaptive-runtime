name: prototype checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node weather_bridge/build.mjs
      - run: node governance/build.mjs
      - run: node --test governance/tests/*.test.mjs
      - run: python -m unittest discover -s tests -v
      - run: python -m az_runtime demo --output outputs
      - uses: actions/upload-artifact@v4
        with:
          name: prototype-ledgers
          path: outputs
